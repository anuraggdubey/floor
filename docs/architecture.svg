<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Floor architecture</title>
  <desc id="d">A holder in the browser asks the worker for quotes. Three AI underwriters sign quotes. The holder buys through the floor contract on NEAR testnet, which reads its price from the peg pool, pays from locked margin, and can ask the NEAR signer to sign a USDC transfer on Ethereum Sepolia.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8d939c"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4b8dff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ffb454"/></marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#16191e"/></pattern>
  </defs>

  <rect width="1200" height="640" rx="20" fill="#08090b"/>
  <rect width="1200" height="640" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="638" rx="19" fill="none" stroke="#23272e"/>

  <!-- zone labels -->
  <text x="40" y="52" fill="#8d939c" font-size="12" letter-spacing="3">OFF CHAIN</text>
  <text x="440" y="52" fill="#8d939c" font-size="12" letter-spacing="3">NEAR TESTNET</text>
  <text x="940" y="52" fill="#8d939c" font-size="12" letter-spacing="3">ETHEREUM SEPOLIA</text>

  <!-- zone panels -->
  <rect x="24" y="66" width="372" height="548" rx="14" fill="#0e1013" stroke="#23272e"/>
  <rect x="424" y="66" width="480" height="548" rx="14" fill="#0e1013" stroke="#1e6ef3" stroke-opacity=".55"/>
  <rect x="932" y="66" width="244" height="548" rx="14" fill="#0e1013" stroke="#23272e"/>

  <!-- OFF CHAIN -->
  <g>
    <rect x="48" y="92" width="324" height="92" rx="10" fill="#16191e" stroke="#23272e"/>
    <text x="68" y="124" fill="#f3f2ee" font-size="18" font-weight="600">Holder</text>
    <text x="68" y="148" fill="#8d939c" font-size="13.5">Browser, no wallet. A guest NEAR</text>
    <text x="68" y="167" fill="#8d939c" font-size="13.5">account is made for you.</text>

    <rect x="48" y="224" width="324" height="104" rx="10" fill="#16191e" stroke="#23272e"/>
    <text x="68" y="256" fill="#f3f2ee" font-size="18" font-weight="600">Worker API</text>
    <text x="68" y="280" fill="#8d939c" font-size="13.5">RFQ and quote signing, price feed,</text>
    <text x="68" y="299" fill="#8d939c" font-size="13.5">keeper, arbitrage bot, EVM executor.</text>
    <text x="68" y="318" fill="#4b8dff" font-size="12">cannot move funds the contract refuses</text>

    <rect x="48" y="368" width="324" height="226" rx="10" fill="#16191e" stroke="#ffb454" stroke-opacity=".5"/>
    <text x="68" y="400" fill="#f3f2ee" font-size="18" font-weight="600">Three AI underwriters</text>
    <text x="68" y="422" fill="#8d939c" font-size="13.5">Each has its own NEAR account, own</text>
    <text x="68" y="441" fill="#8d939c" font-size="13.5">margin and own ed25519 quote key.</text>
    <g font-size="13" fill="#f3f2ee">
      <rect x="68" y="462" width="284" height="34" rx="7" fill="#0e1013" stroke="#23272e"/><text x="82" y="484">Aggressive</text><text x="338" y="484" text-anchor="end" fill="#8d939c">cheapest premium</text>
      <rect x="68" y="504" width="284" height="34" rx="7" fill="#0e1013" stroke="#23272e"/><text x="82" y="526">Volatility</text><text x="338" y="526" text-anchor="end" fill="#8d939c">reads deviation</text>
      <rect x="68" y="546" width="284" height="34" rx="7" fill="#0e1013" stroke="#23272e"/><text x="82" y="568">History</text><text x="338" y="568" text-anchor="end" fill="#8d939c">reads recent peg</text>
    </g>
  </g>

  <!-- NEAR -->
  <g>
    <rect x="448" y="92" width="432" height="200" rx="10" fill="#16191e" stroke="#1e6ef3"/>
    <text x="468" y="124" fill="#f3f2ee" font-size="18" font-weight="600">floor <tspan fill="#8d939c" font-size="13" font-weight="400">  floorxa-floor.testnet</tspan></text>
    <g font-size="13.5" fill="#8d939c">
      <text x="468" y="154">1  verify the ed25519 quote, refuse replays</text>
      <text x="468" y="176">2  state gate: in band, no recent breach, waited</text>
      <text x="468" y="198">3  lock that underwriter's margin</text>
      <text x="468" y="220">4  track sustained breaches per tier</text>
      <text x="468" y="242">5  trigger: pay the holder from locked margin</text>
    </g>
    <text x="468" y="274" fill="#46e39b" font-size="12.5">GATE_CLOSED on a late buyer, premium refunded on chain</text>

    <rect x="448" y="332" width="204" height="108" rx="10" fill="#16191e" stroke="#23272e"/>
    <text x="466" y="362" fill="#f3f2ee" font-size="17" font-weight="600">peg-pool</text>
    <text x="466" y="385" fill="#8d939c" font-size="13">Dumpable demo stable.</text>
    <text x="466" y="404" fill="#8d939c" font-size="13">Anyone can trade against</text>
    <text x="466" y="423" fill="#8d939c" font-size="13">it. The peg price is its.</text>

    <rect x="676" y="332" width="204" height="108" rx="10" fill="#16191e" stroke="#23272e"/>
    <text x="694" y="362" fill="#f3f2ee" font-size="17" font-weight="600">fusdc</text>
    <text x="694" y="385" fill="#8d939c" font-size="13">NEP-141 demo money:</text>
    <text x="694" y="404" fill="#8d939c" font-size="13">premiums, margin, payouts.</text>
    <text x="694" y="423" fill="#8d939c" font-size="13">ft_transfer_call.</text>

    <rect x="448" y="480" width="432" height="114" rx="10" fill="#16191e" stroke="#ffb454" stroke-opacity=".55"/>
    <text x="468" y="510" fill="#f3f2ee" font-size="17" font-weight="600">Chain Signatures <tspan fill="#8d939c" font-size="13" font-weight="400">  v1.signer-prod.testnet</tspan></text>
    <text x="468" y="535" fill="#8d939c" font-size="13.5">floor builds a USDC transfer itself, hashes it,</text>
    <text x="468" y="555" fill="#8d939c" font-size="13.5">and asks the NEAR MPC network to sign that hash.</text>
    <text x="468" y="577" fill="#ffb454" font-size="12.5">no bridge, capped at 5 USDC per payout</text>
  </g>

  <!-- SEPOLIA -->
  <g>
    <rect x="956" y="480" width="196" height="114" rx="10" fill="#16191e" stroke="#ffb454"/>
    <text x="974" y="510" fill="#f3f2ee" font-size="17" font-weight="600">USDC payout</text>
    <text x="974" y="535" fill="#8d939c" font-size="13">Sent from the address the</text>
    <text x="974" y="554" fill="#8d939c" font-size="13">contract controls, mined on</text>
    <text x="974" y="573" fill="#8d939c" font-size="13">Sepolia, shown on Etherscan.</text>

    <rect x="956" y="92" width="196" height="150" rx="10" fill="#16191e" stroke="#23272e"/>
    <text x="974" y="122" fill="#f3f2ee" font-size="16" font-weight="600">Always checkable</text>
    <text x="974" y="148" fill="#8d939c" font-size="13">Every step is a real</text>
    <text x="974" y="167" fill="#8d939c" font-size="13">transaction. Open it on</text>
    <text x="974" y="186" fill="#8d939c" font-size="13">NearBlocks or Etherscan,</text>
    <text x="974" y="205" fill="#8d939c" font-size="13">no keys needed.</text>

    <rect x="956" y="272" width="196" height="168" rx="10" fill="#16191e" stroke="#ff4438" stroke-opacity=".5"/>
    <text x="974" y="302" fill="#ff4438" font-size="14" font-weight="600">Honest limits</text>
    <text x="974" y="326" fill="#8d939c" font-size="12.5">Testnet, demo credits.</text>
    <text x="974" y="345" fill="#8d939c" font-size="12.5">Peg is a demo stable.</text>
    <text x="974" y="364" fill="#8d939c" font-size="12.5">Spot price, not a TWAP.</text>
    <text x="974" y="383" fill="#8d939c" font-size="12.5">Ethereum leg is outbound</text>
    <text x="974" y="402" fill="#8d939c" font-size="12.5">only and trusts an executor.</text>
  </g>

  <!-- ARROWS -->
  <g fill="none" stroke-width="2">
    <!-- holder <-> worker -->
    <path d="M210 184V222" stroke="#8d939c" marker-end="url(#a)" marker-start="url(#a)"/>
    <!-- worker -> underwriters -->
    <path d="M210 328V366" stroke="#8d939c" marker-end="url(#a)" marker-start="url(#a)"/>
    <!-- holder buy -> floor -->
    <path d="M372 138H410Q420 138 420 148V150Q420 158 430 158H446" stroke="#4b8dff" marker-end="url(#b)"/>
    <!-- keeper worker -> floor -->
    <path d="M372 276H410Q420 276 420 266V230Q420 218 432 218H446" stroke="#8d939c" marker-end="url(#a)"/>
    <!-- pool -> floor -->
    <path d="M550 332V294" stroke="#4b8dff" marker-end="url(#b)"/>
    <!-- fusdc <-> floor -->
    <path d="M778 332V294" stroke="#8d939c" marker-end="url(#a)" marker-start="url(#a)"/>
    <!-- floor -> signer -->
    <path d="M664 440V478" stroke="#ffb454" marker-end="url(#g)"/>
    <!-- signer -> sepolia -->
    <path d="M880 536H954" stroke="#ffb454" marker-end="url(#g)"/>
  </g>

  <!-- step badges -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="410" cy="148" r="11" fill="#1e6ef3"/><text x="410" y="152.5" fill="#fff">1</text>
    <circle cx="228" cy="205" r="0" fill="none"/>
    <circle cx="550" cy="313" r="11" fill="#1e6ef3"/><text x="550" y="317.5" fill="#fff">2</text>
    <circle cx="410" cy="270" r="11" fill="#16191e" stroke="#8d939c"/><text x="410" y="274.5" fill="#f3f2ee">3</text>
    <circle cx="664" cy="459" r="11" fill="#ffb454"/><text x="664" y="463.5" fill="#08090b">4</text>
    <circle cx="917" cy="536" r="11" fill="#ffb454"/><text x="917" y="540.5" fill="#08090b">5</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#8d939c">
    <text x="40" y="632" fill="#4b8dff">1 buy with signed quote   2 price read   3 keeper pokes, activates, triggers   4 sign request   5 USDC lands</text>
  </g>
</svg>
