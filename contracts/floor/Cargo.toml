[package]
name = "floor"
version = "0.1.0"
edition = "2021"
description = "Floor: depeg cover market on NEAR. Solver-signed quotes, per-policy locked margin, state gate, sustained-breach trigger, automatic payout."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2"
