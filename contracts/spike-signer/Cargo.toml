[package]
name = "spike-signer"
version = "0.1.0"
edition = "2021"
description = "Spike S1: can a NEAR contract build an EVM USDC transfer itself and get it signed by NEAR Chain Signatures?"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
